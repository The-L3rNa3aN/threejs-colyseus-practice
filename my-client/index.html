<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colyseus Co-op Client</title>
  <style>
    body
    {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a1a;
        color: #eee;
    }
    .section
    {
        background: #252525;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
    }
    input, button
    {
        padding: 8px 12px;
        font-size: 14px;
        margin: 4px 4px 4px 0;
    }
    button
    {
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:disabled
    {
        background: #555;
        cursor: not-allowed;
    }
    #log
    {
        background: #111;
        border: 1px solid #333;
        padding: 12px;
        height: 280px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
    }
    #inviteBox
    {
        font-size: 16px;
        font-weight: bold;
        color: #4CAF50;
        margin-top: 10px;
        word-break: break-all;
    }
    .hint
    {
        font-size: 13px;
        color: #aaa;
        margin-top: 6px;
    }
  </style>
</head>
<body>
    <h1>Colyseus Co-op Client</h1>

    <div class="section">
      <label>Your Name:</label>
      <input type="text" id="playerName" value="Player" style="width: 220px;">
    </div>

    <div class="section">
        <h3>Create Room (Host)</h3>
        <input type="text" id="serverUrl" placeholder="Server URL (e.g. https://xxxx.lhr.life)" style="width: 340px;"><br>
        <button id="btnCreate">Create Room</button>
        <div id="inviteBox"></div>
        <button id="btnCopyInvite" style="display: none; margin-top: 8px;">Copy Invite Link</button>
        <div class="hint">
            1. Start the server + tunnel first.<br>
            2. Paste the public tunnel URL above.<br>
            3. Click "Create Room".
        </div>
    </div>

    <div class="section">
        <h3>Join With Invite Link</h3>
        <input type="text" id="inviteInput" placeHolder="Paste invite here (roomId@https://...)" style="width: 340px;"><br>
        <button id="btnJoin">Join Room</button>
        <button id="btnLeave" disabled>Leave Room</button>
        <div class="hint">Ask the host for the invite link and paste it here.</div>
    </div>

    <div class="section">
      <h3>Chat</h3>
      <input type="text" id="messageInput" placeholder="Say something..." style="width: 300px;" disabled>
      <button id="btnSend" disabled>Send</button>
    </div>

    <div id="status">Status: Not connected</div>
    <div id="log"></div>

    <!-- Colyseus client SDK via CDN -->
    <script src="https://unpkg.com/@colyseus/sdk/dist/colyseus.js"></script>

    <script>
        let client = null;
        let room = null;
        
        const logEl = document.getElementById("log");
        const statusEl = document.getElementById("status");
        const inviteBox = document.getElementById("inviteBox");
        const btnCreate = document.getElementById("btnCreate");
        const btnCopyInvite = document.getElementById("btnCopyInvite");
        const btnJoin = document.getElementById("btnJoin");
        const btnLeave = document.getElementById("btnLeave");
        const btnSend = document.getElementById("btnSend");
        const messageInput = document.getElementById("messageInput");

        function log(msg)
        {
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
      
        function updateUI(connected)
        {
            btnCreate.disabled = connected;
            btnJoin.disabled = connected;
            btnLeave.disabled = !connected;
            btnSend.disabled = !connected;
            messageInput.disabled = !connected;

            statusEl.textContent = connected ? `Status: Connected to room ${room.roomId}` : "Status: Not connected";
        }

        function setupRoomListeners()
        {
            // Listen for any message.
            room.onMessage("*", (type, message) =>
            {
                if(type === "chat")
                    log(`${message.from}: ${message.text}`);
                else
                    log(`[${type}]: ${JSON.stringify(message)}`);
            });

            room.onLeave((code) =>
            {
                log(`Left the room (code: ${code})`);
                room = null;
                inviteBox.textContent = "";
                btnCopyInvite.style.display = "none";
                updateUI(false);
            });

            room.onError((code, message) => { log(`Error ${code}: ${message}`) });
        }

        // Button events
        btnCreate.onclick = async () =>
        {
            let serverUrl = document.getElementById("serverUrl").value.trim();
            let name = document.getElementById("playerName").value.trim() || "Player";

            try
            {
                if(!serverUrl) return log("Please enter the public tunnel URL first.");

                btnCreate.disabled = true;
                btnLeave.disabled = true;
                
                log("Starting server...");
                
                btnCreate.textContent = "Starting server...";
                client = new Colyseus.Client(serverUrl);
                room = await client.create("my_room", { name });

                let invite = `${room.roomId}@${serverUrl}`;

                inviteBox.textContent = `Invite Link: ${invite}`;
                btnCopyInvite.style.display = "inline-block";

                log("Room created!");
                log(`Invite: ${invite}`);

                setupRoomListeners();
                updateUI(true);

                btnCreate.textContent = "Create Room";
            }
            catch (e)
            {
                log("Error creating room: " + (e.message || e));
                console.error(e);

                btnCreate.disabled = false;
                btnCreate.textContent = "Create Room";

                btnLeave.disabled = true;
            }
        };

        btnJoin.onclick = async () =>
        {
            try
            {
                let invite = document.getElementById("inviteInput").value.trim();
                let name = document.getElementById("playerName").value.trim() || "Player";
            
                if (!invite) return log("Please paste the invite link.");

                let parts = invite.split("@");

                if(parts.length < 2) return log("Invalid invite format. Expected: roomId@https://...");
            
                let roomId = parts[0];
                let serverUrl = parts.slice(1).join("@");   //If the URL contains '@'
            
                log(`Joining room ${roomId}...`);

                client = new Colyseus.Client(serverUrl);
                room = await client.joinById(roomId, { name });

                log(`Successfully joined!`);
                setupRoomListeners();
                updateUI(true);
            }
            catch(e)
            {
                log(`Error joining room: ${e.message || e}`);
                console.error(e);
            }
        };

        btnLeave.onclick = () =>
        {
            btnLeave.disabled = true;
            btnLeave.textContent = "Leaving...";
            btnCreate.disabled = true;

            log("Leaving room...");

            try { if (room) room.leave() }
            catch (e) { log(`Error while leaving: ${e.message}`) }

            btnLeave.textContent = "Leave Room";
            btnCreate.disabled = false;
            btnCreate.textContent = "Create Room";
            updateUI(false);
        };

        btnSend.onclick = () =>
        {
            if (!room) return;

            let text = messageInput.value.trim();

            if(!text) return;

            room.send("chat", { text });
            log(`You: ${text}`);
            messageInput.value = "";
        };

        //Enter is send.
        messageInput.addEventListener("keyup", (e) => { if(e.key === "Enter") btnSend.click() });

        btnCopyInvite.onclick = () =>
        {
            let text = inviteBox.textContent.replace("Invite Link: ", "");
            navigator.clipboard.writeText(text).then(log.bind(this, "Invite link copied!"));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colyseus Co-op (CLIENT & SERVER)</title>
  <style>
    body
    {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a1a;
        color: #eee;
    }
    .section
    {
        background: #252525;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
    }
    input, button
    {
        padding: 8px 12px;
        font-size: 14px;
        margin: 4px 4px 4px 0;
    }
    button
    {
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:disabled
    {
        background: #555;
        cursor: not-allowed;
    }
    #log
    {
        background: #111;
        border: 1px solid #333;
        padding: 12px;
        height: 280px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
    }
    #inviteBox
    {
        font-size: 16px;
        font-weight: bold;
        color: #4CAF50;
        margin-top: 10px;
        word-break: break-all;
    }
    .hint
    {
        font-size: 13px;
        color: #aaa;
        margin-top: 6px;
    }
  </style>
</head>
<body>
    <h1>Colyseus Co-op (CLIENT & SERVER)</h1>

    <div class="section">
      <label>Your Name:</label>
      <input type="text" id="playerName" value="Player" style="width: 220px;">
    </div>

    <div class="section">
        <h3>Create a Room</h3>
        <button id="btnCreate">Create Room</button>
        <div style="margin-top: 16px">
            <div id="inviteBox" style="font-size: 16px; font-weight: bold; color: #4CAF50; word-break: break-all;"></div>
            <button id="btnCopyInvite" style="margin-top: 8px; display: none;">Copy Link</button>
        </div>
        <div class="hint">Click to create a server and generate an invite link.</div>
    </div>

    <div class="section">
        <h3>Join With Invite Link</h3>
        <input type="text" id="inviteInput" placeHolder="Paste invite here (roomId@https://...)" style="width: 340px;">
        <button id="btnJoin">Join Room</button>
        <div class="hint">Example: aB3xY7qP2@https://something.localhost.run</div>
    </div>

    <div class="section">
        <button id="btnLeave" disabled>Leave Room</button>
    </div>

    <div class="section">
      <h3>Send Message:</h3>
      <input type="text" id="messageInput" placeholder="message type (e.g. chat)" style="width: 300px;">
      <button id="btnSend" disabled>Send</button>
    </div>

    <div id="status">Status: Not connected</div>
    <div id="log"></div>

    <!-- Colyseus client SDK via CDN -->
    <script src="https://unpkg.com/@colyseus/sdk/dist/colyseus.js"></script>

    <script>
        let client = null;
        let room = null;
        
        const logEl = document.getElementById("log");
        const statusEl = document.getElementById("status");
        const inviteBox = document.getElementById("inviteBox");
        const btnCopyInvite = document.getElementById("btnCopyInvite");
        const btnCreate = document.getElementById("btnCreate");
        const btnJoin = document.getElementById("btnJoin");
        const btnLeave = document.getElementById("btnLeave");
        const btnSend = document.getElementById("btnSend");
        
        function log(msg)
        {
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
      
        function updateUI(connected)
        {
            btnCreate.disabled = connected;
            btnJoin.disabled = connected;
            btnLeave.disabled = !connected;
            btnSend.disabled = !connected;

            statusEl.textContent = `Status: Hosting room ${room.roomId} - Share the invite link`;
        }

        function setupRoomListeners()
        {
            // Listen for any message.
            room.onMessage("*", (type, message) =>
            {
                if(type === "chat")
                    log(`${message.from}: ${message.text}`);
                else
                    log(`← [${type}]: ${JSON.stringify(message)}`);
            });

            room.onLeave((code) =>
            {
                log(`Left the room (code: ${code})`);
                room = null;
                
                inviteBox.textContent = "";
                btnCopyInvite.style.display = "none";
            });

            room.onError((code, message) => { log(`Error ${code}: ${message}`) });
        }

        // Button events
        btnCopyInvite.onclick = () =>
        {
            let inviteText = document.getElementById("inviteBox").textContent.replace("Invite Link: ", "");

            navigator.clipboard.writeText(inviteText).then(() =>
            {
                let originalText = btnCopyInvite.textContent;
                btnCopyInvite.textContent = "Copied!";
                btnCopyInvite.disabled = true;

                setTimeout(() =>
                {
                    btnCopyInvite.textContent = originalText;
                    btnCopyInvite.disabled = false;
                }, 1500);

                log("Invite link copied to clipboard.");
            })
            .catch(err => { log("Failed to copy: " + err) });
        }

        btnCreate.onclick = async () =>
        {
            let name = document.getElementById("playerName").value.trim() || "Player";

            try
            {
                //Disabling create button and showing loading.
                btnCreate.disabled = true;
                btnLeave.disabled = true;
                btnCreate.textContent = "Starting server...";
                log("Starting server...");

                //Start Colyseus server
                await window.electronAPI.startServer();
                await new Promise(resolve => setTimeout(resolve, 4000));   //Wait for server.

                //Start tunnel
                btnCreate.textContent = "Starting tunnel...";
                log("Starting tunnel...");
                
                let publicUrl = await window.electronAPI.startTunnel();
                log(`Tunnel ready: ${publicUrl}`);

                //Create room with public URL
                btnCreate.textContent = "Creating room...";
                client = new Colyseus.Client(publicUrl);
                room = await client.create("my_room", { name });

                let invite = `${room.roomId}@${publicUrl}`;

                inviteBox.textContent = `Invite link: ${invite}`;
                btnCopyInvite.style.display = "inline-block";

                log(`Room created!`);
                log(`Invite: ${invite}`);

                setupRoomListeners();
                updateUI(true);

                btnCreate.textContent = "Create Room";
            }
            catch(e)
            {
                log(`Error creating room: ${e.message || e}`);
                console.error(e);

                //Clean up, in case of failure.
                await window.electronAPI.stopAll();

                btnCreate.disabled = false;
                btnCreate.textContent = "Create Room";

                btnLeave.disabled = true;
            }
        };

        btnJoin.onclick = async () =>
        {
            try
            {
                let invite = document.getElementById("inviteInput").value.trim();
                let name = document.getElementById("playerName").value.trim() || "Player";
            
                if (!invite) return log("Please paste the invite link.");

                let parts = invite.split("@");

                if(parts.length < 2) return log("Invalid invite format. Expected: roomId@serverUrl");
            
                let roomId = parts[0];
                let serverUrl = parts.slice(1).join("@");   //If the URL contains '@'
            
                log(`Joining room ${roomId} on ${serverUrl}...`);

                client = new Colyseus.Client(serverUrl);
                room = await client.joinById(roomId, { name });

                log(`Successfully joined!`);
                setupRoomListeners();
                updateUI(true);
            }
            catch(e)
            {
                log(`Error joining room: ${e.message || e}`);
                console.error(e);
            }
        };

        btnLeave.onclick = async () =>
        {
            btnLeave.disabled = true;
            btnLeave.textContent = "Leaving...";
            btnCreate.disabled = true;

            log("Leaving room and shutting everything down...")

            try
            {
                if (room) await room.leave();

                await window.electronAPI.stopAll();
                log("Server and tunnel stopped.");
            }
            catch(e) { log(`Error while leaving: ${e.message}`) }

            btnLeave.textContent = "Leave Room";
            btnCreate.disabled = false;
            btnCreate.textContent = "Create Room";
            updateUI(false);
        };

        btnSend.onclick = () =>
        {
            console.log("Room: ", room);
            if (!room) return;

            const text = document.getElementById("messageInput").value.trim();

            if(!text) return;

            room.send("chat", { text });
            log(`→ You: ${text}`);
            document.getElementById("messageInput").value = "";
        };

        //Enter is send.
        document.getElementById("messageInput").addEventListener("keyup", (e) =>
        {
            if(e.key === "Enter") btnSend.click();
        });
    </script>
</body>
</html>

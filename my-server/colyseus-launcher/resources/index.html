<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Colyseus Server Launcher</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #eee;
      padding: 28px;
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px 0;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 22px;
      font-size: 14px;
    }
    .section {
      background: #252525;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    button {
      padding: 10px 14px;
      margin: 5px 6px 5px 0;
      font-size: 14px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    button.secondary {
      background: #2196F3;
    }
    button.danger {
      background: #f44336;
    }
    button.ghost {
      background: #444;
    }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 12px;
      height: 230px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      margin-top: 10px;
    }
    .status {
      margin-top: 6px;
      color: #bbb;
      font-size: 14px;
    }
    #publicUrlBox {
      font-size: 15px;
      font-weight: 600;
      color: #4CAF50;
      word-break: break-all;
      margin-top: 8px;
      min-height: 22px;
    }
    .hint {
      font-size: 13px;
      color: #999;
      margin-top: 8px;
      line-height: 1.45;
    }
    ol.hint {
      padding-left: 18px;
      margin: 8px 0 0 0;
    }
  </style>
</head>
<body>

  <h1>Colyseus Server Launcher</h1>
  <div class="subtitle">Host tool for your 2-player co-op server</div>

  <div class="section">
    <button id="btnStartBoth">Start Server + Tunnel</button>
    <button id="btnStartServer" class="secondary">Start Server Only</button>
    <button id="btnStartTunnel" class="secondary">Start Tunnel Only</button>
    <button id="btnStop" class="danger" disabled>Stop All</button>
    <button id="btnClearLog" class="ghost">Clear Log</button>
  </div>

  <div class="section">
    <div><strong>Public URL</strong></div>
    <div id="publicUrlBox">Not available yet</div>
    <button id="btnCopyUrl" class="secondary" style="margin-top: 10px;" disabled>Copy Public URL</button>

    <ol class="hint">
      <li>Click <strong>Start Server + Tunnel</strong></li>
      <li>Copy the Public URL when it appears</li>
      <li>Open the client, paste the URL, and create a room</li>
      <li>Share the full invite link (<code>roomId@url</code>) with your friend</li>
    </ol>
  </div>

  <div class="status" id="status">Status: Idle</div>
  <div id="log"></div>

  <script src="js/neutralino.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
